<!DOCTYPE html>
<html lang="en"><head><meta http-equiv="Content-Type" content="text/html; charset=UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Artificial Fun with Boomaga — Listen Live</title>
<style>
  :root{
    --page-bg: #000000;
    --frame: #6998b6;
    --ink: #101214;
    --ink-soft: #33383d;
    --white: #ffffff;
    --black-accent: #0a0a0a;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    background: var(--page-bg);
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    padding: 24px;
  }

  .tile {
    width: 100%;
    max-width: 340px;
    background: var(--frame);
    border-radius: 18px;
    padding: 0 24px 24px;
    position: relative;
    box-shadow: 0 30px 60px -20px rgba(0,0,0,0.85);
    overflow: hidden;
  }

  .logo-wrap {
    margin: 0 -24px 18px;
  }

  .logo-wrap img {
    width: 100%;
    display: block;
    border-radius: 0;
  }

  .row {
    display: flex;
    justify-content: center;
    align-items: baseline;
    font-family: 'Space Mono', 'Courier New', monospace;
    color: var(--ink-soft);
    font-size: 12px;
    letter-spacing: 0.08em;
    margin-bottom: 6px;
  }

  .status-dot {
    display: inline-block;
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--ink-soft);
    margin-right: 6px;
    vertical-align: middle;
  }

  .status-dot.live { background: var(--white); animation: pulse 1.6s infinite ease-in-out; }
  .status-dot.error { background: var(--black-accent); animation: none; }

  @keyframes pulse {
    0%, 100% { opacity: 1; box-shadow: 0 0 0 0 rgba(255,255,255,0.5); }
    50% { opacity: 0.6; box-shadow: 0 0 0 6px rgba(255,255,255,0); }
  }

  .symbol-wrap {
    display: flex;
    justify-content: center;
    margin: 18px 0 10px;
  }

  button.play {
    width: 128px;
    height: 128px;
    border-radius: 22px;
    border: none;
    background: linear-gradient(155deg, #1a1a1a, #000000);
    color: var(--white);
    font-family: 'Space Mono', 'Courier New', monospace;
    font-size: 44px;
    font-weight: 700;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    transition: transform 0.15s ease, box-shadow 0.2s ease;
    box-shadow: 0 10px 24px -8px rgba(0,0,0,0.6);
  }

  button.play:hover { transform: translateY(-2px); }
  button.play:active { transform: translateY(0px) scale(0.98); }

  button.play .glyph { position: relative; z-index: 2; }

  .bars {
    position: absolute;
    bottom: 14px;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    gap: 4px;
    align-items: flex-end;
    height: 18px;
    opacity: 0;
    transition: opacity 0.2s ease;
  }
  .bars.on { opacity: 1; }
  .bars span {
    display: block;
    width: 3px;
    background: var(--white);
    border-radius: 2px;
    animation: eq 0.9s infinite ease-in-out;
  }
  .bars span:nth-child(1){ animation-delay: 0s; }
  .bars span:nth-child(2){ animation-delay: 0.15s; }
  .bars span:nth-child(3){ animation-delay: 0.3s; }
  .bars span:nth-child(4){ animation-delay: 0.45s; }
  @keyframes eq {
    0%, 100% { height: 4px; }
    50% { height: 16px; }
  }

  .name {
    text-align: center;
    font-size: 21px;
    font-weight: 800;
    color: var(--ink);
    letter-spacing: 0.01em;
    margin-top: 4px;
  }

  .subtitle {
    text-align: center;
    font-size: 11px;
    font-weight: 700;
    color: var(--white);
    letter-spacing: 0.16em;
    margin-top: 3px;
  }

  .tagline {
    text-align: center;
    font-size: 13px;
    color: var(--ink-soft);
    margin-top: 8px;
    margin-bottom: 16px;
  }

  .tagline a { color: var(--ink); text-decoration: none; font-weight: 600; }

  .meta {
    font-family: 'Space Mono', 'Courier New', monospace;
    font-size: 11px;
    color: var(--ink-soft);
    text-align: center;
    letter-spacing: 0.05em;
    min-height: 16px;
  }

  .now-playing-label {
    font-family: 'Space Mono', 'Courier New', monospace;
    font-size: 10px;
    font-weight: 700;
    color: var(--ink);
    text-align: center;
    letter-spacing: 0.12em;
    margin-top: 14px;
  }

  .track {
    font-family: 'Space Mono', 'Courier New', monospace;
    font-size: 12px;
    color: var(--white);
    text-align: center;
    letter-spacing: 0.02em;
    margin-top: 4px;
    min-height: 16px;
    line-height: 1.4;
    word-break: break-word;
    font-weight: 700;
  }

  .linktree {
    text-align: center;
    margin-top: 18px;
  }

  .linktree a {
    display: inline-block;
    font-family: 'Space Mono', 'Courier New', monospace;
    font-size: 11px;
    letter-spacing: 0.08em;
    color: var(--white);
    background: var(--black-accent);
    padding: 8px 16px;
    border-radius: 999px;
    text-decoration: none;
    transition: transform 0.15s ease;
  }

  .linktree a:hover { transform: translateY(-1px); }

  audio { display: none; }
</style>
</head>

    <div class="name">Artificial Fun with Boomaga</div>
    <div class="subtitle">ALL-DAY RADIO STREAM</div>
    <div class="tagline">Comedy, Music, and AI Gone Horribly Wrong.<br><a href="mailto:artificialfunpod@gmail.com">artificialfunpod@gmail.com</a></div>
    <div class="meta" id="metaText">tap to tune in</div>

    <div class="now-playing-label">NOW PLAYING:</div>
    <div class="track" id="trackText"></div>

      <a href="https://boomaga.com" target="_blank" rel="noopener">boomaga.com</a>
    </div>

  <audio id="stream" preload="none">
    <source src="https://eagle.streemlion.com/proxy/artifici?mp=/stream" type="audio/mpeg">
    <source src="https://eagle.streemlion.com/proxy/artifici?mp=/" type="audio/mpeg">
  </audio>

  <script>
    const audio = document.getElementById('stream');
    const playBtn = document.getElementById('playBtn');
    const glyph = document.getElementById('glyph');
    const bars = document.getElementById('bars');
    const statusDot = document.getElementById('statusDot');
    const statusText = document.getElementById('statusText');
    const metaText = document.getElementById('metaText');
    const trackText = document.getElementById('trackText');

    let playing = false;

    function setLive() {
      statusDot.className = 'status-dot live';
      statusText.textContent = 'ON AIR';
      metaText.textContent = 'streaming now';
      bars.classList.add('on');
    }
    function setStandby() {
      statusDot.className = 'status-dot';
      statusText.textContent = 'STANDBY';
      metaText.textContent = 'tap to tune in';
      bars.classList.remove('on');
    }
    function setError() {
      statusDot.className = 'status-dot error';
      statusText.textContent = 'OFFLINE';
      metaText.textContent = 'stream unreachable — try again shortly';
      bars.classList.remove('on');
      glyph.textContent = '▶';
      playing = false;
    }
    function setLoading() {
      statusText.textContent = 'CONNECTING';
      metaText.textContent = 'buffering…';
    }

    playBtn.addEventListener('click', () => {
      if (!playing) {
        setLoading();
        audio.play().then(() => {
          playing = true;
          glyph.textContent = '❚❚';
          setLive();
        }).catch(setError);
      } else {
        audio.pause();
        playing = false;
        glyph.textContent = '▶';
        setStandby();
      }
    });

    audio.addEventListener('waiting', setLoading);
    audio.addEventListener('playing', setLive);
    audio.addEventListener('error', setError);
    audio.addEventListener('stalled', setError);

    // ---- Now Playing ----
    const NOW_PLAYING_URL = "https://nowplaying.artificialfunpod.workers.dev/";

    function cleanTrackName(raw) {
      return raw.replace(/\s*\[[^\]]*\]\s*$/, '').trim();
    }

    async function updateNowPlaying() {
      try {
        const res = await fetch(NOW_PLAYING_URL, { cache: "no-store" });
        const raw = await res.text();
        trackText.textContent = cleanTrackName(raw);
      } catch (err) {
        console.warn("Now playing fetch failed:", err);
      }
    }

    updateNowPlaying();
    setInterval(updateNowPlaying, 15000);
  </script>
