<!DOCTYPE html>

<html lang="en"><head><meta http-equiv="Content-Type" content="text/html; charset=UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Artificial Fun with Boomaga — Listen Live</title>
<style>
  :root{
    --bg: #14151a;
    --tile: #1b1d23;
    --maroon: #800020;
    --maroon-bright: #a8002d;
    --sage: #96a08c;
    --ink: #f0ede6;
    --ink-dim: #9a988f;
    --gold: #d4a017;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    background: var(--bg);
    background-image:
      radial-gradient(circle at 20% 20%, rgba(128,0,32,0.12), transparent 40%),
      radial-gradient(circle at 80% 80%, rgba(150,160,140,0.08), transparent 40%);
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    padding: 24px;
  }

  .tile {
    width: 100%;
    max-width: 340px;
    background: var(--tile);
    border: 2px solid rgba(150,160,140,0.25);
    border-radius: 18px;
    padding: 28px 24px 24px;
    position: relative;
    box-shadow: 0 30px 60px -20px rgba(0,0,0,0.6);
  }

  .tile::before {
    content: "";
    position: absolute;
    inset: 0;
    border-radius: 18px;
    padding: 1px;
    background: linear-gradient(135deg, var(--maroon-bright), transparent 40%);
    -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
    -webkit-mask-composite: xor;
    mask-composite: exclude;
    pointer-events: none;
  }

  .row {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    font-family: 'Space Mono', 'Courier New', monospace;
    color: var(--ink-dim);
    font-size: 12px;
    letter-spacing: 0.08em;
    margin-bottom: 6px;
  }

  .status-dot {
    display: inline-block;
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--sage);
    margin-right: 6px;
    vertical-align: middle;
  }

  .status-dot.live { background: var(--gold); animation: pulse 1.6s infinite ease-in-out; }
  .status-dot.error { background: var(--maroon-bright); animation: none; }

  @keyframes pulse {
    0%, 100% { opacity: 1; box-shadow: 0 0 0 0 rgba(212,160,23,0.5); }
    50% { opacity: 0.6; box-shadow: 0 0 0 6px rgba(212,160,23,0); }
  }

  .symbol-wrap {
    display: flex;
    justify-content: center;
    margin: 18px 0 10px;
  }

  button.play {
    width: 128px;
    height: 128px;
    border-radius: 22px;
    border: none;
    background: linear-gradient(155deg, var(--maroon), #5c0018);
    color: var(--ink);
    font-family: 'Space Mono', 'Courier New', monospace;
    font-size: 44px;
    font-weight: 700;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    transition: transform 0.15s ease, box-shadow 0.2s ease;
    box-shadow: 0 10px 24px -8px rgba(128,0,32,0.7);
  }

  button.play:hover { transform: translateY(-2px); }
  button.play:active { transform: translateY(0px) scale(0.98); }

  button.play .glyph { position: relative; z-index: 2; }

  .bars {
    position: absolute;
    bottom: 14px;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    gap: 4px;
    align-items: flex-end;
    height: 18px;
    opacity: 0;
    transition: opacity 0.2s ease;
  }
  .bars.on { opacity: 1; }
  .bars span {
    display: block;
    width: 3px;
    background: var(--gold);
    border-radius: 2px;
    animation: eq 0.9s infinite ease-in-out;
  }
  .bars span:nth-child(1){ animation-delay: 0s; }
  .bars span:nth-child(2){ animation-delay: 0.15s; }
  .bars span:nth-child(3){ animation-delay: 0.3s; }
  .bars span:nth-child(4){ animation-delay: 0.45s; }
  @keyframes eq {
    0%, 100% { height: 4px; }
    50% { height: 16px; }
  }

  .name {
    text-align: center;
    font-size: 21px;
    font-weight: 700;
    color: var(--ink);
    letter-spacing: 0.01em;
    margin-top: 4px;
  }

  .tagline {
    text-align: center;
    font-size: 13px;
    color: var(--ink-dim);
    margin-top: 4px;
    margin-bottom: 18px;
  }

  .meta {
    font-family: 'Space Mono', 'Courier New', monospace;
    font-size: 11px;
    color: var(--ink-dim);
    text-align: center;
    letter-spacing: 0.05em;
    min-height: 16px;
  }

  audio { display: none; }
</style>
</head>
<body>

  <div class="tile">
    <div class="row">
      <span><span class="status-dot" id="statusDot"></span><span id="statusText">STANDBY</span></span>
      <span>Ar · Fn</span>
    </div>

    <div class="symbol-wrap">
      <button class="play" id="playBtn" aria-label="Play stream">
        <span class="glyph" id="glyph">▶</span>
        <span class="bars" id="bars"><span></span><span></span><span></span><span></span></span>
      </button>
    </div>

    <div class="name">Artificial Fun with Boomaga</div>
    <div class="tagline">Comedy, Music, and AI Gone Horribly Wrong.<br><a href="mailto:artificialfunpod@gmail.com" style="color: var(--gold); text-decoration: none;">artificialfunpod@gmail.com</a></div>
    <div class="meta" id="metaText">tap to tune in</div>
  </div>

  <audio id="stream" preload="none">
    <source src="https://eagle.streemlion.com/proxy/artifici?mp=/stream" type="audio/mpeg">
    <source src="https://eagle.streemlion.com/proxy/artifici?mp=/" type="audio/mpeg">
  </audio>

  <script>
    const audio = document.getElementById('stream');
    const playBtn = document.getElementById('playBtn');
    const glyph = document.getElementById('glyph');
    const bars = document.getElementById('bars');
    const statusDot = document.getElementById('statusDot');
    const statusText = document.getElementById('statusText');
    const metaText = document.getElementById('metaText');

    let playing = false;

    function setLive() {
      statusDot.className = 'status-dot live';
      statusText.textContent = 'ON AIR';
      metaText.textContent = 'streaming now';
      bars.classList.add('on');
    }
    function setStandby() {
      statusDot.className = 'status-dot';
      statusText.textContent = 'STANDBY';
      metaText.textContent = 'tap to tune in';
      bars.classList.remove('on');
    }
    function setError() {
      statusDot.className = 'status-dot error';
      statusText.textContent = 'OFFLINE';
      metaText.textContent = 'stream unreachable — try again shortly';
      bars.classList.remove('on');
      glyph.textContent = '▶';
      playing = false;
    }
    function setLoading() {
      statusText.textContent = 'CONNECTING';
      metaText.textContent = 'buffering…';
    }

    playBtn.addEventListener('click', () => {
      if (!playing) {
        setLoading();
        audio.play().then(() => {
          playing = true;
          glyph.textContent = '❚❚';
          setLive();
        }).catch(setError);
      } else {
        audio.pause();
        playing = false;
        glyph.textContent = '▶';
        setStandby();
      }
    });

    audio.addEventListener('waiting', setLoading);
    audio.addEventListener('playing', setLive);
    audio.addEventListener('error', setError);
    audio.addEventListener('stalled', setError);
  </script>



</body></html>
